name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gatsby-sibal
    env:
      GATSBY_CPU_COUNT: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: gatsby-sibal/.nvmrc
          cache: npm
          cache-dependency-path: gatsby-sibal/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
